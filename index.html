<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
</head>
<body>
    <main>
        <h1>Dice Roller</h1>
        <p>Roll a die and try your luck!</p>

        <div id="dice" aria-label="Die showing one">⚀</div>

        <button id="roll-button" type="button">Roll Dice</button>
        <p id="result" aria-live="polite">Click the button to roll.</p>
    </main>
</body>
</html>
